name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yml
    steps:
      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@v1.9
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true

  # isotovideo:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v6
  #     - uses: kalikiana/isotovideo-action@main
  #       with:
  #         schedule: tests/foo/bar
  #     - uses: actions/upload-artifact@v3
  #       with:
  #         name: Test results
  #         path: .
  #       if: always()

  run_on_image:
    name: Spin up built image and run tests
    needs: bluebuild
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull built image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/literatos:latest
          echo "Pulling $IMAGE"
          docker pull "$IMAGE"

      - name: Run command inside image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/literatos:latest
          echo "Running command inside $IMAGE"
          # adjust the command below to whatever you want to run on the image
          docker run --rm "$IMAGE" /bin/bash -lc "echo 'OS release:'; cat /etc/os-release || true; echo; echo 'uname:'; uname -a"
